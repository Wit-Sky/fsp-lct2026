# Стенд одной командой: docker compose up -d --build  →  http://localhost (API: /api, Swagger: /api/docs)
# Переменные — в .env (см. .env.example); без .env работают значения по умолчанию для локального запуска.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:${POSTGRES_PASSWORD:-fsp}@db:5432/fsp
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-32b}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      FSP_REDIRECT_URI: ${PUBLIC_URL:-http://localhost}/api/auth/fsp/callback
      FSP_ISSUER: ${PUBLIC_URL:-http://localhost}/api/auth/fsp/mock
      DEMO_MODE: ${DEMO_MODE:-1}
      DEMO_COOLDOWN_MIN: ${DEMO_COOLDOWN_MIN:-2}
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"   # для vite dev-сервера; снаружи — только через nginx

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # HTTPS-прокси для стенда. Включается в .env: COMPOSE_PROFILES=https, DOMAIN=..., HTTP_PORT=127.0.0.1:8080
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
